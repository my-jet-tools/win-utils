[package]
name = "win-service-host"
version = "0.1.2"
edition = "2024"
description = "Hosts a Rust binary as a native Windows service (install/uninstall/start/run-as-service)"
authors = ["my-jet-tools"]

[dependencies]
tokio = { version = "1", features = ["full"] }

my-logger = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-logger.git" }

[target.'cfg(windows)'.dependencies]
# Native Windows-service integration: --install/--uninstall talk to the SCM,
# --run-as-service implements the service control protocol (a plain console
# exe registered with sc.exe would be killed with error 1053).
windows-service = "0.8"
